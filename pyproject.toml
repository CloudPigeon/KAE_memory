[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kae-memory"
version = "0.1.0"
description = "RefractMem multi-view memory compilation and requirement-driven evidence gathering"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CloudPigeon"}]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "python-dateutil>=2.8,<3",
  "python-dotenv>=1,<2",
  "rank-bm25>=0.2.2,<1",
  "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
evaluation = ["nltk>=3.8,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
kae-memory = "prism.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/E-mem/LICENSE", "third_party/E-mem/NOTICE"]

[tool.setuptools.package-data]
prism = ["resources/*.txt", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
